
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#166534">
  <title>PeekKavach — Evidence Camera</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 650px;
      margin: 24px auto;
      padding: 0 16px;
      color: #222;
    }

    button, input {
      font: inherit;
      padding: 10px 14px;
      margin: 5px 3px 5px 0;
    }

    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.6; }

    video, #preview, .saved-photo {
      display: block;
      width: 100%;
      max-width: 500px;
      margin: 14px 0;
      border-radius: 8px;
    }

    #status { padding: 10px 0; }
    .saved-item { border-top: 1px solid #ddd; padding: 12px 0; }
    .metadata { font-size: 0.9rem; color: #555; }
  </style>
</head>

<body>
  <h1>PeekKavach Evidence Camera</h1>
  <p>Capture and save crop-damage evidence, even when offline.</p>

  <label for="incidentId">Incident ID</label>
  <input id="incidentId" value="demo-incident-001" required>

  <div>
    <button id="startCamera">Open Camera</button>
    <button id="capture" disabled>Capture Photo</button>
    <button id="retake" hidden>Retake</button>
    <button id="keep" hidden>Keep Photo</button>
  </div>

  <p id="status" role="status" aria-live="polite">
    Ready. Open the camera to begin.
  </p>

  <video id="video" autoplay playsinline muted hidden></video>
  <canvas id="canvas" hidden></canvas>
  <img id="preview" alt="Preview of captured evidence" hidden>

  <hr>
  <h2>Saved Evidence</h2>
  <button id="refreshEvidence">Refresh Saved Evidence</button>
  <div id="savedEvidence"></div>

  <script type="module">
    import Dexie from "dexie";;

    const db = new Dexie("PeekKavachEvidence");

    db.version(1).stores({
      incidents: "id, updatedAt",
      photos: "++id, incidentId, capturedAt, syncStatus",
      notes: "++id, incidentId, createdAt"
    });

    const $ = (id) => document.getElementById(id);

    const startButton = $("startCamera");
    const captureButton = $("capture");
    const retakeButton = $("retake");
    const keepButton = $("keep");
    const video = $("video");
    const canvas = $("canvas");
    const preview = $("preview");
    const status = $("status");
    const incidentInput = $("incidentId");
    const savedEvidence = $("savedEvidence");

    let stream = null;
    let photoBlob = null;
    let previewUrl = null;
    let capturedAt = null;
    let locationData = {
      latitude: null,
      longitude: null,
      accuracy: null
    };

    function setStatus(message) {
      status.textContent = message;
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      video.hidden = true;
      captureButton.disabled = true;
      startButton.disabled = false;
    }

    function clearPreview() {
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      preview.removeAttribute("src");
      preview.hidden = true;
      photoBlob = null;
    }

    async function getLocation() {
      if (!("geolocation" in navigator)) return;

      return new Promise(resolve => {
        navigator.geolocation.getCurrentPosition(
          position => resolve({
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy
          }),
          () => resolve({
            latitude: null,
            longitude: null,
            accuracy: null
          }),
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
      });
    }

    startButton.addEventListener("click", async () => {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("Camera API unavailable. Use localhost or HTTPS.");
        return;
      }

      try {
        startButton.disabled = true;

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });

        video.srcObject = stream;
        video.hidden = false;
        preview.hidden = true;

        await video.play();
        captureButton.disabled = false;
        setStatus("Camera ready. Capture your crop-damage evidence.");
      } catch (error) {
        stopCamera();
        setStatus(`Camera unavailable: ${error.message}`);
      }
    });

    captureButton.addEventListener("click", async () => {
      if (!video.videoWidth || !video.videoHeight) {
        setStatus("Camera is still starting. Try again.");
        return;
      }

      captureButton.disabled = true;
      setStatus("Capturing photo and reading available location...");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);

      canvas.toBlob(async blob => {
        if (!blob) {
          captureButton.disabled = false;
          setStatus("Photo capture failed. Please try again.");
          return;
        }

        photoBlob = blob;
        capturedAt = new Date().toISOString();
        locationData = await getLocation();

        previewUrl = URL.createObjectURL(blob);
        preview.src = previewUrl;
        preview.hidden = false;
        video.hidden = true;

        retakeButton.hidden = false;
        keepButton.hidden = false;

        const gpsMessage = locationData.latitude === null
          ? "GPS unavailable; photo can still be saved."
          : "GPS location recorded.";

        setStatus(`Review your photo. ${gpsMessage}`);
      }, "image/jpeg", 0.9);
    });

    retakeButton.addEventListener("click", () => {
      clearPreview();
      locationData = {
        latitude: null,
        longitude: null,
        accuracy: null
      };

      capturedAt = null;
      video.hidden = false;
      retakeButton.hidden = true;
      keepButton.hidden = true;
      captureButton.disabled = false;
      setStatus("Camera ready. Capture another photo.");
    });

    keepButton.addEventListener("click", async () => {
      const incidentId = incidentInput.value.trim();

      if (!incidentId || !photoBlob) {
        setStatus("Enter an incident ID and capture a photo first.");
        return;
      }

      keepButton.disabled = true;

      try {
        const photoId = await db.photos.add({
          incidentId,
          blob: photoBlob,
          capturedAt,
          latitude: locationData.latitude,
          longitude: locationData.longitude,
          accuracy: locationData.accuracy,
          evidenceType: "crop-damage",
          syncStatus: "pending"
        });

        // Update the local incident record.
        await db.incidents.put({
          id: incidentId,
          updatedAt: new Date().toISOString()
        });

        setStatus(`Evidence saved offline successfully. Photo ID: ${photoId}`);

        clearPreview();
        retakeButton.hidden = true;
        keepButton.hidden = true;
        stopCamera();

        await renderSavedEvidence();
      } catch (error) {
        console.error("Failed to save evidence:", error);
        setStatus("Could not save evidence. Please try again.");
      } finally {
        keepButton.disabled = false;
      }
    });

    async function renderSavedEvidence() {
      // Revoke URLs created by the previous render.
      savedEvidence.querySelectorAll("img[data-object-url]").forEach(img => {
        URL.revokeObjectURL(img.dataset.objectUrl);
      });

      savedEvidence.replaceChildren();

      try {
        const incidentId = incidentInput.value.trim();
        const photos = await db.photos
          .where("incidentId")
          .equals(incidentId)
          .toArray();

        if (!photos.length) {
          savedEvidence.textContent = "No saved photos for this incident yet.";
          return;
        }

        for (const photo of photos) {
          const item = document.createElement("div");
          item.className = "saved-item";

          const image = document.createElement("img");
          image.className = "saved-photo";
          image.alt = "Saved crop evidence";
          image.dataset.objectUrl = URL.createObjectURL(photo.blob);
          image.src = image.dataset.objectUrl;

          const metadata = document.createElement("p");
          metadata.className = "metadata";
          metadata.textContent =
            `Photo #${photo.id} · ${new Date(photo.capturedAt).toLocaleString()} · ${photo.syncStatus}`;

          item.append(image, metadata);

          if (photo.latitude !== null && photo.longitude !== null) {
            const gps = document.createElement("p");
            gps.className = "metadata";
            gps.textContent =
              `GPS: ${photo.latitude.toFixed(6)}, ${photo.longitude.toFixed(6)}`;
            item.append(gps);
          }

          const download = document.createElement("button");
          download.textContent = "Download Photo";
          download.addEventListener("click", () => {
            const url = URL.createObjectURL(photo.blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `peekkavach-evidence-${photo.id}.jpg`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          });

          item.append(download);
          savedEvidence.append(item);
        }
      } catch (error) {
        console.error("Could not retrieve evidence:", error);
        setStatus("Could not load saved evidence.");
      }
    }

    $("refreshEvidence").addEventListener("click", renderSavedEvidence);
    incidentInput.addEventListener("change", renderSavedEvidence);

    window.addEventListener("pagehide", () => {
      stopCamera();

      if (previewUrl) URL.revokeObjectURL(previewUrl);

      savedEvidence.querySelectorAll("img[data-object-url]").forEach(img => {
        URL.revokeObjectURL(img.dataset.objectUrl);
      });
    });

    // Display evidence already saved for this incident on page load.
    try {
      await db.open();
      await renderSavedEvidence();
      setStatus("Database ready. Open the camera to begin.");
    } catch (error) {
      console.error("Database initialization failed:", error);
      setStatus("Could not open the local evidence database.");
    }
  </script>
</body>
</html>
